# Local development backing services for Mycelium Forge (DD-09, DD-18).
# Extends service definitions from docker-compose.yml.
# Run with: docker compose -f docker-compose.dev.yml up -d

name: forge

services:
  postgres:
    extends:
      file: docker-compose.yml
      service: postgres

  postgres-authentication:
    extends:
      file: docker-compose.yml
      service: postgres-authentication

  garage:
    extends:
      file: docker-compose.yml
      service: garage

  keycloak:
    extends:
      file: docker-compose.yml
      service: keycloak
    environment:
      # Forge runs on the host from the IDE (http profile port), not as a compose service.
      FORGE_SPI_BASE_URL: http://host.docker.internal:5000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres-authentication:
        condition: service_healthy

volumes:
  postgres-data:
  keycloak-postgres-data:
  garage-meta:
  garage-data:

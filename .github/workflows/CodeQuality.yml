name: Build & Test & SonarQube

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - name: Set up JDK 17
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          distribution: 'temurin'
          java-version: '17'
          overwrite-settings: false

      - name: Setup dotnet
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: '10.0.x'

      # No Node or pnpm step: DD-08 builds Tailwind from the standalone CLI, which
      # Directory.Build.targets fetches and checksum-verifies during the build.
      - name: Restore dependencies
        run: dotnet restore Mycelium.Forge.sln

      - name: Sonarqube Begin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_SCANNER_OPTS: "-Xmx4096m"
        run: |
          dotnet tool install --global dotnet-sonarscanner
          dotnet tool install --global dotnet-coverage
          # AutoGen*/** are machine-generated data holders / readers / writers emitted by the code
          # generator. They are near-identical by construction and not hand-maintained, so they are
          # excluded from analysis entirely (issues, coverage and duplication) so the gates reflect the
          # hand-written code. The same pattern also matches the golden copies under
          # Mycelium.Forge.Generator.Tests/Expected/AutoGen*. Test projects (**/*.Tests/**) are excluded from
          # coverage so the coverage figure reflects production code only.
          GENERATED='**/AutoGenDto/**/*.cs,**/AutoGenEnum/**/*.cs,**/AutoGenEnumProvider/**/*.cs,**/AutoGenJsonDeSerializers/**/*.cs,**/AutoGenJsonSerializers/**/*.cs'
          TESTS='**/*.Tests/**/*.cs'
          dotnet sonarscanner begin /k:"mycelium-cmbse_mycelium-forge" /o:"mycelium-cmbse" /d:sonar.token="$SONAR_TOKEN" /d:sonar.host.url="https://sonarcloud.io" /d:sonar.cs.vscoveragexml.reportsPaths=coverage.xml /d:sonar.exclusions="$GENERATED,**/wwwroot/css/app.css" /d:sonar.cpd.exclusions="$GENERATED,**/wwwroot/css/app.css" /d:sonar.coverage.exclusions="$TESTS"

      - name: Build
        run: dotnet build Mycelium.Forge.sln --no-restore --no-incremental /p:ContinuousIntegrationBuild=true

      # The end-to-end suites drive a host over the network and fail with connection-refused when
      # nothing is listening on :5000. They stay out of this job until F-09 makes them self-hosting.
      - name: Run Tests and Compute Coverage
        run: dotnet-coverage collect "dotnet test Mycelium.Forge.sln --no-restore --no-build --verbosity normal --filter TestCategory!=EndToEnd" -f xml -o "coverage.xml"

      - name: Sonarqube end
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"
